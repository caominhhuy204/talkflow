spring:
  datasource:
    url: jdbc:h2:mem:taskflow_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      repositories:
        enabled: false
  cache:
    type: simple

security:
  jwt:
    secret-key: dGVzdHNlY3JldHRlc3RzZWNyZXR0ZXN0c2VjcmV0dGVzdHNlY3JldA==
    expiration-ms: 3600000

app:
  cors:
    allowed-origins: http://localhost:5173
