version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: taskflow-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: taskflow_db
    ports:
      - "3307:3306"
    volumes:
      - taskflow_mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: taskflow-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - taskflow_redis_data:/data

volumes:
  taskflow_mysql_data:
  taskflow_redis_data: